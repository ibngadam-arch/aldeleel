<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دليلك الجامعي - القبول للجامعات السودانية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Tajawal', sans-serif; 
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      background-image: 
        radial-gradient(rgba(234, 179, 8, 0.08) 1px, transparent 1px),
        radial-gradient(rgba(16, 185, 129, 0.08) 1px, #0f172a 1px);
      background-size: 40px 40px;
      color: #f8fafc;
    }
    
    /* شريط الأخبار المتحرك بأسلوب قناة الجزيرة */
    .aljazeera-ticker-wrap {
      width: 100%;
      background: #991b1b; /* أحمر عاجل عالي التباين */
      border-bottom: 3px solid #facc15; /* لمسة ذهبية براقة */
      overflow: hidden;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .aljazeera-ticker {
      display: inline-block;
      white-space: nowrap;
      padding-right: 100%;
      animation: ticker-animation 20s linear infinite;
    }

    .aljazeera-ticker-item {
      display: inline-block;
      font-size: 1.35rem;
      font-weight: 900;
      color: #ffffff;
      padding: 8px 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      letter-spacing: 0.5px;
    }

    @keyframes ticker-animation {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(100%, 0, 0); }
    }

    /* شريط العلم السوداني */
    .sudan-banner-line {
      height: 5px;
      background: linear-gradient(to left, #007a3d 0% 33.3%, #ffffff 33.3% 66.6%, #000000 66.6% 100%);
    }

    .sudan-card {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(14px);
      border: 2px solid #334155;
      border-right: 6px solid #eab308;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sudan-card:hover {
      border-color: #10b981;
      border-right-color: #10b981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
      transform: translateY(-3px);
    }

    .bright-input {
      background-color: #1e293b !important;
      border: 2px solid #475569 !important;
      color: #ffffff !important;
      font-size: 1.15rem !important;
    }
    .bright-input:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35) !important;
    }

    .glow-gold {
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <div>
    <!-- شريط الأخبار العاجلة المتحرك بأسلوب الجزيرة -->
    <div class="aljazeera-ticker-wrap">
      <div class="aljazeera-ticker">
        <div class="aljazeera-ticker-item">
          😍 تصميم أحمد محمدنور — دليل القبول التفاعلي للجامعات السودانية ✍️
        </div>
      </div>
    </div>

    <!-- شريط العلم السوداني -->
    <div class="sudan-banner-line"></div>

    <!-- Header -->
    <header class="bg-slate-900/95 backdrop-blur-md sticky top-0 z-50 border-b border-slate-700/80 shadow-2xl">
      <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-2xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-emerald-500/30 border border-emerald-400/30">
            🇸🇩
          </div>
          <span class="font-black text-2xl text-white tracking-tight">القبول الجامعي السوداني</span>
        </div>
        <span class="text-base bg-emerald-950/90 text-emerald-400 border-2 border-emerald-500/40 px-5 py-1.5 rounded-full font-black shadow-lg">
          دليلك الجامعي
        </span>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="max-w-4xl mx-auto text-center pt-8 pb-4 px-4">
      <h1 class="text-3xl md:text-5xl font-black text-white mb-2 leading-tight glow-gold">
        دليلك الجامعي للقبول والكليات
      </h1>
      <p class="text-emerald-400 text-lg md:text-xl font-bold max-w-xl mx-auto">
        اختر المجال أو النسبة للوصول إلى النتيجة المباشرة والدقيقة.
      </p>
    </section>

    <!-- Search Component Card -->
    <main class="max-w-4xl mx-auto px-4 pb-16">
      <div class="bg-slate-900/90 rounded-3xl shadow-2xl border-2 border-slate-700/90 p-6 md:p-8 mb-8 backdrop-blur-md relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 relative z-10">
          
          <!-- النسبة المئوية -->
          <div>
            <label class="block text-base font-black text-emerald-400 mb-2">النسبة (%)</label>
            <input type="number" id="input-percentage" step="0.1" min="0" max="100" placeholder="مثال: 85.5" oninput="executeSearch()"
              class="bright-input w-full rounded-2xl px-4 py-3 font-black outline-none transition-all" />
          </div>

          <!-- تصنيف المجال -->
          <div>
            <label class="block text-base font-black text-emerald-400 mb-2">المجال / التخصص</label>
            <select id="select-category" onchange="executeSearch()" class="bright-input w-full rounded-2xl px-4 py-3 font-black outline-none transition-all">
              <option value="">كل المجالات</option>
              <option value="engineering">هندسي</option>
              <option value="cs">حاسوب وتقانة</option>
              <option value="medical">طبي وصحي</option>
              <option value="arts">أدبي وإنساني</option>
              <option value="science">علمي أساسي</option>
              <option value="business">إداري واقتصادي</option>
            </select>
          </div>
          
          <!-- اسم الجامعة -->
          <div>
            <label class="block text-base font-black text-emerald-400 mb-2">الجامعة</label>
            <input type="text" id="input-university" placeholder="مثال: الخرطوم" oninput="executeSearch()"
              class="bright-input w-full rounded-2xl px-4 py-3 font-black outline-none transition-all" />
          </div>
          
          <!-- اسم الكلية -->
          <div>
            <label class="block text-base font-black text-emerald-400 mb-2">الكلية</label>
            <input type="text" id="input-major" placeholder="مثال: صيدلة..." oninput="executeSearch()"
              class="bright-input w-full rounded-2xl px-4 py-3 font-black outline-none transition-all" />
          </div>

        </div>

      </div>

      <!-- Filters Bar / Count -->
      <div id="filter-bar" class="hidden bg-slate-800/90 p-4 rounded-2xl border-2 border-slate-700 mb-6 flex items-center justify-between text-lg font-black shadow-lg">
        <span id="results-count" class="text-emerald-400 text-xl font-black"></span>
      </div>

      <!-- Empty / Initial State -->
      <div id="empty-state" class="bg-slate-900/80 border-2 border-dashed border-slate-700 rounded-3xl p-12 text-center max-w-lg mx-auto">
        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 font-black text-2xl shadow-inner">🔍</div>
        <h3 class="text-white font-black text-2xl mb-2">ابدأ البحث الآن</h3>
        <p class="text-slate-400 text-base font-bold">اختر المجال (هندسي، حاسوب، طبي، أدبي) أو ادخل النسبة لعرض الكليات مباشرة.</p>
      </div>

      <!-- Results Grid -->
      <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>
  </div>

  <!-- ربط ملف البيانات data.js -->
  <script src="data.js"></script>

  <script>
    function normalizeText(text) {
      if (!text) return '';
      return text.replace(/[إأآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim().toLowerCase();
    }

    function matchesCategory(collegeName, category) {
      if (!category) return true;
      const text = normalizeText(collegeName);

      if (category === 'engineering') {
        return text.includes('هندسه') || text.includes('عمارة') || text.includes('تخطيط');
      }
      if (category === 'cs') {
        return text.includes('حاسوب') || text.includes('برمجيات') || text.includes('تقانة المعـلومات') || text.includes('تقنية المعلومات') || text.includes('شبكات') || text.includes('معلومات');
      }
      if (category === 'medical') {
        return text.includes('طب') || text.includes('صيدلة') || text.includes('مختبرات') || text.includes('تمريض') || text.includes('اسنان') || text.includes('صحة') || text.includes('تخدير') || text.includes('اشعة') || text.includes('بصريات') || text.includes('علاج طبيعى');
      }
      if (category === 'arts') {
        return text.includes('آداب') || text.includes('اداب') || text.includes('قانون') || text.includes('شريعة') || text.includes('إعلام') || text.includes('اعلام') || text.includes('لغات') || text.includes('تربية') || text.includes('دعوة') || text.includes('اصول الدين') || text.includes('فنون') || text.includes('دراما');
      }
      if (category === 'science') {
        return text.includes('علوم') || text.includes('رياضيات') || text.includes('فيزياء') || text.includes('كيمياء') || text.includes('أحياء') || text.includes('احياء') || text.includes('زراعة') || text.includes('بيطري') || text.includes('غابات');
      }
      if (category === 'business') {
        return text.includes('إدارة') || text.includes('ادارة') || text.includes('اقتصاد') || text.includes('محاسبة') || text.includes('تجارية') || text.includes('تجارة') || text.includes('مصارف') || text.includes('علوم مالية');
      }
      return true;
    }

    function executeSearch() {
      const pInput = document.getElementById('input-percentage').value;
      const score = parseFloat(pInput) || 0;
      const category = document.getElementById('select-category').value;
      const univTerm = normalizeText(document.getElementById('input-university').value);
      const majorTerm = normalizeText(document.getElementById('input-major').value);

      const grid = document.getElementById('results-grid');
      const empty = document.getElementById('empty-state');
      const filterBar = document.getElementById('filter-bar');

      if (score === 0 && !category && !univTerm && !majorTerm) {
        grid.innerHTML = '';
        filterBar.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.querySelector('h3').innerText = "ابدأ البحث الآن";
        empty.querySelector('p').innerText = "اختر المجال (هندسي، حاسوب، طبي، أدبي) أو ادخل النسبة لعرض الكليات مباشرة.";
        return;
      }

      const db = (typeof admissionData !== 'undefined') ? admissionData : [];

      const filteredResults = db.filter(item => {
        const matchesScore = score > 0 ? score >= item.rate : true;
        const matchesCat = matchesCategory(item.college, category);
        const matchesUniv = !univTerm || normalizeText(item.univ).includes(univTerm);
        const matchesMajor = !majorTerm || normalizeText(item.college).includes(majorTerm);

        return matchesScore && matchesCat && matchesUniv && matchesMajor;
      });

      filteredResults.sort((a, b) => b.rate - a.rate);

      renderResults(filteredResults, score);
    }

    function renderResults(list, userScore) {
      const grid = document.getElementById('results-grid');
      const empty = document.getElementById('empty-state');
      const filterBar = document.getElementById('filter-bar');
      grid.innerHTML = '';

      if (list.length === 0) {
        empty.classList.remove('hidden');
        filterBar.classList.add('hidden');
        empty.querySelector('h3').innerText = "لم نجد نتائج مطابقة";
        empty.querySelector('p').innerText = "تأكد من اختيار المجال أو الكلمة بشكل صحيح.";
        return;
      }

      empty.classList.add('hidden');
      filterBar.classList.remove('hidden');
      document.getElementById('results-count').innerText = `عدد النتائج المطابقة: (${list.length})`;

      list.forEach(item => {
        const margin = userScore > 0 ? (userScore - item.rate).toFixed(1) : null;

        const card = document.createElement('div');
        card.className = "sudan-card rounded-3xl p-6 flex flex-col justify-between";
        
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-base font-black px-4 py-1.5 bg-slate-800 text-yellow-400 border border-yellow-500/30 rounded-xl">${item.univ}</span>
              ${userScore > 0 ? `<span class="text-xs px-3 py-1.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full font-black">متاح ✓</span>` : ''}
            </div>
            
            <h2 class="text-xl md:text-2xl font-black text-white leading-snug mb-5">${item.college}</h2>
            
            <div class="bg-slate-900/90 rounded-2xl p-4 grid grid-cols-2 gap-3 border border-slate-700/80">
              <div>
                <span class="text-slate-400 block text-xs font-bold mb-1">حد القبول (النسبة):</span>
                <span class="font-black text-emerald-400 text-2xl">${item.rate.toFixed(1)}%</span>
              </div>
              <div>
                <span class="text-slate-400 block text-xs font-bold mb-1">${margin !== null ? 'الفارق عن نسبتك:' : 'المفاضلة:'}</span>
                <span class="font-black ${margin !== null ? 'text-emerald-300' : 'text-slate-200'} text-2xl">
                  ${margin !== null ? `+${margin}%` : (item.diff > 0 ? item.diff : '-')}
                </span>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
